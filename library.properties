sentence=Talk to a Norsk Data SINTRAN III machine over XMSG: terminal sessions and COSMOS file access over LAPB/HDLC.
paragraph=Portable C11 with no allocation after start-up and no threads; the application supplies the byte transport (TCP, serial, synchronous HDLC) and the clock. The COSMOS file-access layer and the FTP command core are compile options.
